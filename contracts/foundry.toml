[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
solc_version = "0.8.26"
via_ir = true

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Monad testnet — see README.md for RPC endpoints and faucet.
[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"
local = "http://127.0.0.1:8545"

[etherscan]
# Monad testnet's Blockscout-based explorer supports the Etherscan verify API.
monad_testnet = { key = "${MONADSCAN_API_KEY}", url = "https://testnet.monadscan.com/api" }
